name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-rust:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: clared-core
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: clared-core
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: clared-core
        run: cargo test --verbose

  test-python:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: clared-python
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run Pytest
        working-directory: clared-python
        run: pytest -v

  integration-demo:
    name: Fault Injection Demo
    runs-on: ubuntu-latest
    needs: [test-rust, test-python]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run one-command fault-injection demo
        run: make demo
