name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-rust:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: clared-core
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: clared-core
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: clared-core
        run: cargo test --verbose

  test-python:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: clared-python
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run Pytest
        working-directory: clared-python
        run: pytest -v

  integration-demo:
    name: Fault Injection Demo
    runs-on: ubuntu-latest
    needs: [test-rust, test-python]
    env:
      CLARED_DELEGATION_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python client
        run: pip install ./clared-python
      - name: Build reference server
        working-directory: clared-core
        run: cargo build
      - name: Run fault-injection demo
        run: |
          ./clared-core/target/debug/clared-guard > /tmp/clared-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c 'import socket,time
          for _ in range(50):
              try:
                  socket.create_connection(("127.0.0.1", 4000), timeout=0.1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Clared server did not start")'
          python examples/fault_injection_demo.py
