[package]
name = "clared-core"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of bounded execution sessions for action-taking agents"
authors = ["Clared <liran@clared.ai>"]
license = "Apache-2.0"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = "0.9"

# In-Memory Policy Decision Engine
cedar-policy = "3.2"

# High-Performance Concurrency & Memory
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[[bin]]
name = "clared-guard"
path = "src/main.rs"
