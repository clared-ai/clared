[package]
name = "clared-core"
version = "0.1.0"
edition = "2021"
description = "Safe-Execution Proxy & Commit-Time Authorization Enclave for AI Agents"
authors = ["Clared Team <hello@clared.ai>"]
license = "Apache-2.0"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
async-trait = "0.1"

# In-Memory Policy Decision Engine
cedar-policy = "3.2"

# High-Performance Concurrency & Memory
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "clared-guard"
path = "src/main.rs"
