[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clared"
version = "0.1.0"
description = "Python client and LangGraph / CrewAI middleware for Clared execution firewalls"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Clared Security", email = "oss@clared.ai" },
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/clared-ai/clared"
Repository = "https://github.com/clared-ai/clared"
