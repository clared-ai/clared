[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clared"
version = "0.1.0"
description = "Python client for the Clared execution-envelope reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Clared", email = "liran@clared.ai" },
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://clared.ai"
Repository = "https://github.com/clared-ai/clared"
